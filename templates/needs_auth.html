<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Authentication Required</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='needs_auth.css') }}">
    <meta charset="UTF-8">
    <title>Checklist Grup {{ number }}</title>
</head>
<body>
<a href="/" class="back-link">← Panell central</a>
<div class="card">

    <!-- Back link -->
    <h1>Authentication Required</h1>
    <p>Please sign in to access the admin area.</p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        <input type="text" class="form-group" name="username" placeholder="Username" required>
        <input type="password" class="form-group" name="password" placeholder="Password" required>
        <button type="submit">LOG IN</button>
    </form>

    <div class="footer">
        Admin Access
    </div>
</div>

</body>
</html>
