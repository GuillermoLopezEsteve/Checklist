<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>API Tester</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        h2 {
            margin-bottom: 20px;
        }

        input, textarea, button {
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        textarea {
            min-height: 120px;
            font-family: monospace;
        }

        button {
            background: #4a67d6;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #3b55b5;
        }

        #result {
            background: #f1f1f1;
            padding: 10px;
            border-radius: 6px;
            white-space: pre-wrap;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Simple POST Tester</h2>

    <input type="text" id="url" placeholder="Enter route (e.g. /echo)">

    <textarea id="jsonBody" placeholder='Enter JSON body, e.g. { "name": "John" }'></textarea>

    <button onclick="sendRequest()">Send POST</button>

    <h3>Response:</h3>
    <div id="result">No response yet.</div>
</div>

<script>
async function sendRequest() {
    const url = document.getElementById("url").value;
    const jsonText = document.getElementById("jsonBody").value;
    const resultDiv = document.getElementById("result");

    try {
        const response = await fetch(url, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: jsonText
        });

        const text = await response.text();

        try {
            const json = JSON.parse(text);
            resultDiv.textContent = JSON.stringify(json, null, 2);
        } catch {
            resultDiv.textContent = text;
        }

    } catch (error) {
        resultDiv.textContent = "Error: " + error;
    }
}
</script>

</body>
</html>
