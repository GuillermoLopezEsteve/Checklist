<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
    <meta charset="UTF-8">
    <title>Projecte SMX2</title>
</head>
<body>
        <div class="admin-panel-button"><a href="/admin"><img src="{{ url_for('static', filename='img/admin_panel.png') }}"></a></div>

    <h1>Projecte SMX2  -  1713</h1>

    <div class="grid-container">
        {% for group in groups %}
        <a href="/group{{ group }}" class="card">
            <h2>Grup {{ group }}</h2>
            <p>Mirar tasques</p>
        </a>
        {% endfor %}

        <a href="{{ url_for('go_to_demo_sheet') }}" target="_blank" class="card big demoTasques" rel="noopener noreferrer">
            <h2>Demostració<br>Tasques</h2>
        </a>
       <a href="{{ url_for('leaderboard') }}" class="card big ranking"><h2>Ranking</h2></a>

        {% if session.get('user') %}
            <a href="{{ url_for('admin') }}" class="card big demoTasques"><h2>Admin Panel</h2></a>
            <a href="{{ url_for('logout') }}" class="card big ranking"><h2>Logout</h2></a>
        {% endif %}
    </div>
</body>
</html>
